<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f6">
  <title>日光工作室 · 游戏公司经营</title>
  <link rel="stylesheet" href="style.css">
  <script src="lucide.min.js" defer></script>
  <script src="game.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><i data-lucide="sun"></i></span><div><h1>日光工作室</h1><p>把下一款游戏，做出来。</p></div></div>
      <div class="header-actions"><span id="save-status" class="save-status" role="status">本机存档</span><button class="icon-button" data-action="export" title="导出存档" aria-label="导出存档"><i data-lucide="download"></i></button><button class="icon-button" data-action="import" title="导入存档" aria-label="导入存档"><i data-lucide="upload"></i></button><button class="icon-button" data-action="restart" title="重新创业" aria-label="重新创业"><i data-lucide="rotate-ccw"></i></button></div>
    </header>
    <main id="game-root"></main>
    <footer class="footer"><span>日光工作室 / 创业档案</span><span>第一版 · 本地运行</span></footer>
  </div>
  <div id="notification" class="notification" role="status" aria-live="polite"></div>
  <dialog id="event-dialog" aria-labelledby="event-title"></dialog>
  <dialog id="reset-dialog" aria-labelledby="reset-title"><form method="dialog"><div class="dialog-heading"><span class="eyebrow">新的开始</span><button class="icon-button" aria-label="取消重新创业" title="取消"><i data-lucide="x"></i></button></div><h2 id="reset-title">再开一间工作室？</h2><p>当前经营记录会被新档覆盖。想保留这段经历，可以先导出存档。</p><div class="dialog-actions"><button class="button secondary" value="cancel">保留当前公司</button><button class="button danger" type="button" data-action="confirm-restart"><i data-lucide="rotate-ccw"></i>重新创业</button></div></form></dialog>
  <input type="file" id="import-file" accept=".json,application/json" hidden>
  <noscript><p class="noscript">本游戏需要在浏览器中启用 JavaScript。</p></noscript>
</body>
</html>
