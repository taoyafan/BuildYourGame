<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f7f6">
<title>日光工作室 · 游戏公司经营（HTML 版）</title>
<style>
:root{
  --paper:#f5f7f6; --white:#fff; --ink:#242b29; --muted:#6c7772; --line:#dce3df;
  --green:#176b52; --green-soft:#e8f3ed; --red:#af463a; --yellow:#b07920;
  --display:"Noto Serif SC","Songti SC",SimSun,serif; --body:"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font:14px/1.65 var(--body);padding:10px 10px 72px}
h1,h2,h3,p{margin:0}
h1{font:600 20px/1.4 var(--display)}
h2{font:600 18px/1.45 var(--display);margin-bottom:8px}
h3{font-size:14px;font-weight:600;margin:12px 0 6px}
small{font-size:11px}
b{font-weight:600}
#app{max-width:760px;margin:0 auto;display:grid;gap:10px}
.panel{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.panel.narrow{max-width:420px;margin:40px auto}
.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end}
.top .cash{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.top .cash b{color:var(--ink);font-size:15px}
.controls{display:flex;align-items:center;gap:8px}
.finance{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--white);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.finance div{display:grid;gap:1px;min-width:0}
.finance small{font-size:10px;color:var(--muted);white-space:nowrap}
.finance b{font-size:15px}
.goal{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:#fff8e6;border:1px solid #ecd9a8;border-radius:8px;padding:8px 12px}
.goal span:first-child{display:grid;gap:1px}
.goal small{font-size:10px;color:var(--yellow)}
.goal-dots{display:flex;gap:4px;flex-shrink:0}
.goal-dots i{width:6px;height:6px;border-radius:50%;background:var(--line);display:block}
.goal-dots i.done{background:var(--yellow)}
.goal-dots i.current{background:#f0c56a}
.milestones{display:grid;gap:4px;margin:4px 0 8px}
.milestones .rail{display:block;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.milestones .rail i{display:block;height:100%;background:var(--green)}
.phase-note{font-size:11px;color:var(--green)}
.phase-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}
.phase-labels span.done{color:var(--green);font-weight:600}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0}
.stats-row div{display:grid;gap:1px;min-width:0}
.stats-row small{font-size:10px;color:var(--muted);white-space:nowrap}
.stats-row b{font-size:15px}
.small{font-size:11px}
.clock{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.speed{display:flex;gap:6px}
.pill,.primary,button{font:inherit;color:inherit;border-radius:6px;border:1px solid var(--line);background:var(--white);padding:7px 12px;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.pill.on,.primary{background:var(--green);border-color:var(--green);color:#fff}
.link{border:0;background:transparent;color:var(--green);padding:4px 6px}
.advice{background:var(--green-soft);border-left:3px solid var(--green);border-radius:6px;padding:9px 12px}
.advice p{font-size:12px;color:var(--muted)}
.guide{background:#fdf6e6;border:1px solid #ecd9a8;border-radius:6px;padding:8px 12px;font-size:12px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.guide-actions{display:flex;gap:4px;flex-shrink:0}
.grid{display:grid;gap:10px}
@media(min-width:660px){.grid{grid-template-columns:1.35fr 1fr}}
.statline{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:8px}
.dims{display:grid;gap:6px;margin:6px 0 10px}
.dim{display:grid;grid-template-columns:1fr auto;gap:1px 8px;text-align:left;padding:5px 9px;border:1px solid var(--line);background:var(--white)}
.dim-name{font-size:12px}
.dim-score{font-weight:600;font-size:13px}
.dim .bar{grid-column:1/3;display:block;height:5px;background:var(--green-soft);border-radius:3px;overflow:hidden}
.dim .bar i{display:block;height:100%;background:var(--green)}
.dim small{grid-column:1/3;color:var(--muted);font-size:10px;line-height:1.4}
.dim.bottleneck{border-color:var(--yellow);background:#fdf8ee}
.dim.bottleneck .bar i{background:var(--yellow)}
.dim.idle{border-style:dashed}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.list{display:grid;gap:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;padding:8px 10px}
.row .grow{display:grid}
.row small{color:var(--muted)}
.tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:10px;border:1px solid var(--line);border-radius:10px;padding:1px 7px;color:var(--muted);white-space:nowrap}
.tag.on{background:var(--green-soft);color:var(--green);border-color:var(--green)}
.tag.bad{background:#fbeeec;color:var(--red);border-color:#e6c3bd}
.tag.gold{background:#fdf6e6;color:var(--yellow);border-color:#ecd9a8}
.nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--line);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav button{border:0;border-radius:0;background:var(--white);padding:13px 2px;font-size:12px;color:var(--green)}
#menu{position:fixed;inset:0;background:#242b2955;display:none;align-items:flex-end;justify-content:center;z-index:30;padding:0}
#menu.open{display:flex}
#menu .sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:12px 12px 0 0;display:flex;flex-direction:column}
.sheet-head{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:6px;position:sticky;top:0;background:var(--white);padding-bottom:6px;border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;text-align:center;font-size:17px}
.head-actions{display:flex;gap:4px}
.sheet-body{padding-top:8px;display:grid;gap:6px}
.modal{position:fixed;inset:0;background:#242b2977;display:flex;align-items:center;justify-content:center;padding:14px;z-index:40}
.modal .panel{max-height:88vh;overflow:auto}
.choices{display:grid;gap:8px;margin-top:10px}
.choice{text-align:left;display:grid;gap:2px}
.choice small{color:var(--muted)}
.lines{margin:0;display:grid;gap:2px}
.lines div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding:4px 0;font-size:12px}
.lines dt{color:var(--muted)}
.lines dd{margin:0;text-align:right}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.card{border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:grid;gap:4px}
.note{background:var(--green-soft);border-left:3px solid var(--green);padding:7px 10px;border-radius:4px;font-size:12px}
.muted{color:var(--muted)}
.field{display:grid;gap:6px;margin:10px 0;font-size:12px;font-weight:600}
.field input{font:inherit;font-weight:400;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
.roles{display:flex;gap:6px;flex-wrap:wrap}
.checklist{list-style:none;margin:6px 0;padding:0;display:grid;gap:4px}
.checklist li{display:flex;gap:8px;font-size:12px;padding:6px 8px;border-radius:5px;background:var(--paper)}
.checklist li.ok{background:var(--green-soft)}
.checklist li b{min-width:96px}
.checklist li span{color:var(--muted)}
.dims .dim:hover{border-color:var(--green)}
.person-assign{border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:grid;gap:6px;margin-bottom:6px}
.pa-head{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.works{display:flex;gap:6px;flex-wrap:wrap}
.work{font-size:12px;padding:5px 9px;display:inline-flex;gap:6px;align-items:center}
.work small{color:var(--muted)}
.work.on{background:var(--green);border-color:var(--green);color:#fff}
.work.on small{color:#dff0e8}
.stats{display:flex;gap:14px;flex-wrap:wrap}
.stats div{display:grid}
.stats b{font-size:16px}
.up{color:var(--green)} .down{color:var(--red)}
.chart .bars{display:flex;align-items:flex-end;gap:2px;height:70px;margin-top:6px;border-bottom:1px solid var(--line)}
.chart .bars i{flex:1;background:var(--green);min-width:3px;border-radius:2px 2px 0 0}
.goals{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.goals li{border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:grid;gap:2px}
.goals li.done{background:var(--green-soft);border-color:var(--green)}
.goals li.current{border-color:var(--yellow);background:#fdf8ee}
.goals em{font-style:normal;font-size:11px;color:var(--green)}
.reasons{display:grid;gap:6px}
.cover{display:grid;gap:2px;background:var(--green-soft);border-radius:6px;padding:10px}
.result{display:grid;justify-items:center;background:var(--green-soft);border-radius:6px;padding:10px}
.result b{font:600 30px/1.4 var(--display);color:var(--green)}
.toggle{display:flex;gap:8px;align-items:center;font-size:13px;padding:6px 0}
.toast{position:fixed;left:50%;bottom:82px;transform:translate(-50%,10px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:6px;font-size:12px;opacity:0;pointer-events:none;transition:.18s;z-index:50;max-width:86vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:760px){ body{padding:16px 16px 80px} }
</style>
</head>
<body>
<div id="app"></div>
<div id="menu"></div>
<script src="logic.js"></script>
<script src="ui.js"></script>
</body>
</html>
